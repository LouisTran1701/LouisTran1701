name: Generate profile summary cards

"on":
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate SVG cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: LouisTran1701
          THEME: github_dark
          UTC_OFFSET: 7
          AUTO_PUSH: false

      - name: Commit complete card set
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          card_dir=profile-summary-card-output/github_dark
          for card in \
            0-profile-details.svg \
            1-repos-per-language.svg \
            2-most-commit-language.svg \
            3-stats.svg \
            4-productive-time.svg; do
            test -s "$card_dir/$card"
          done
          git add "$card_dir"
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile summary cards"
          git push origin "HEAD:$DEFAULT_BRANCH"
